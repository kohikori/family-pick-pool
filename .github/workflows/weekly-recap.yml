name: Weekly recap

# Runs Tuesday morning after Monday Night Football, with two retries in case a game
# ran late or ESPN was slow. Each run does nothing if the recap is already written.
# When a new recap is written, it's emailed to every player with an email on file.
# Times are UTC: 11:30 UTC is 7:30am Eastern (6:30am in winter).
on:
  schedule:
    - cron: '30 11 * * 2'
    - cron: '30 17 * * 2'
    - cron: '30 11 * * 3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number (leave blank for the latest week)'
        required: false
      email:
        description: 'Who gets the email'
        type: choice
        options: [me, all, none]
        default: me
      resend:
        description: 'Just email the existing recap (no rewriting)'
        type: boolean
        default: false
      force:
        description: 'Rewrite the recap even if one exists'
        type: boolean
        default: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the email library
        run: npm install --no-save --no-package-lock nodemailer@6.9.16
      - name: Get final scores, write the recap and email it
        run: node scripts/weekly-recap.mjs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEK: ${{ inputs.week }}
          EMAIL: ${{ inputs.email }}
          RESEND: ${{ inputs.resend }}
          FORCE: ${{ inputs.force }}
